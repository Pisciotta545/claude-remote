<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <title>Claude Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    #terminal { height: 100%; }
    /* Permite desplazar el historial con el dedo en el celular. */
    .xterm-viewport { touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    /* Editor de archivos (CodeMirror 5, se carga al abrir el primer archivo). */
    #editor-host .CodeMirror { position: absolute; inset: 0; height: auto; font-size: 13px; }
    #editor-host .CodeMirror, #editor-host .CodeMirror-gutters { background: #0f172a !important; }
    .cm-hit { background: rgba(250, 204, 21, .45); }
    #editor button, #files button { white-space: nowrap; flex-shrink: 0; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen">
  <!-- Panel de control -->
  <header class="bg-slate-800 px-3 py-2 shadow-lg shrink-0">
    <div class="flex items-center justify-between text-xs mb-1">
      <div class="flex items-center gap-2 min-w-0">
        <button id="backBtn" title="Volver a proyectos" class="hidden bg-slate-700 active:bg-emerald-600 rounded-full w-7 h-7 flex items-center justify-center text-lg leading-none shrink-0">&#8592;</button>
        <span id="proj-name" class="font-semibold truncate">Uso de tokens</span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="stopBtn" title="Cerrar la sesión (detiene el proceso)" class="hidden bg-red-600 active:bg-red-500 rounded px-2 py-0.5 text-[11px] font-semibold">Cerrar</button>
        <span id="reset-timer" class="font-mono text-amber-400">--:--:--</span>
      </div>
    </div>
    <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
      <div id="usage-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
    <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400">
      <span id="usage-label">0%</span>
      <span id="conn-status" class="text-red-400">&#9679; desconectado</span>
    </div>
  </header>

  <!-- Selector de proyectos -->
  <section id="picker" class="flex-1 min-h-0 overflow-y-auto p-3">
    <h1 class="text-lg font-semibold mb-1">Elegí un proyecto</h1>
    <p id="picker-hint" class="text-xs text-slate-400 mb-3">Cargando…</p>
    <div id="proj-list" class="grid grid-cols-1 gap-2"></div>
  </section>

  <!-- Terminal -->
  <main id="terminal" class="flex-1 min-h-0 px-1 py-1 hidden"></main>

  <!-- Explorador de archivos del proyecto -->
  <section id="files" class="hidden flex-1 min-h-0 flex flex-col">
    <div class="flex items-center gap-1.5 px-2 py-1.5 bg-slate-800/70 text-xs shrink-0">
      <button id="files-up" title="Carpeta anterior" class="bg-slate-700 active:bg-emerald-600 disabled:opacity-40 rounded-lg px-2.5 py-1 font-mono">&#8593; ..</button>
      <span id="files-path" class="flex-1 min-w-0 truncate text-left font-mono text-slate-300" dir="rtl"></span>
      <button id="files-refresh" title="Recargar" class="bg-slate-700 active:bg-emerald-600 rounded-lg px-2.5 py-1">&#10227;</button>
      <button id="files-term" title="Volver a la terminal" class="bg-slate-700 active:bg-emerald-600 rounded-lg px-2.5 py-1">&gt;_ Terminal</button>
    </div>
    <div id="files-list" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-1"></div>
  </section>

  <!-- Editor / visor de un archivo -->
  <section id="editor" class="hidden flex-1 min-h-0 flex flex-col">
    <div class="bg-slate-800/70 px-2 py-1.5 shrink-0 flex flex-col gap-1.5 text-xs">
      <div class="flex items-center gap-1.5">
        <span id="ed-dirty" class="hidden w-2 h-2 rounded-full bg-amber-400 shrink-0" title="Cambios sin guardar"></span>
        <span id="ed-name" class="flex-1 min-w-0 truncate text-left font-mono text-slate-200" dir="rtl"></span>
        <button id="ed-save" class="bg-emerald-600 active:bg-emerald-500 disabled:opacity-40 rounded-lg px-3 py-1 font-semibold">&#128190; Guardar</button>
      </div>
      <div id="ed-tools" class="flex gap-1.5 overflow-x-auto">
        <button id="ed-edit">&#9998; Editar</button>
        <button id="ed-find-btn">&#128269; Buscar</button>
        <button id="ed-undo" title="Deshacer">&#8630;</button>
        <button id="ed-redo" title="Rehacer">&#8631;</button>
        <button id="ed-tab" title="Insertar tabulación">&#8677; Tab</button>
        <button id="ed-wrap" title="Ajustar líneas largas">&#8617; Ajuste</button>
        <button id="ed-reload" title="Volver a leer el archivo de la PC">&#10227; Recargar</button>
        <button id="ed-mention" title="Escribir @archivo en el prompt de Claude">@ Claude</button>
      </div>
      <div id="ed-find" class="hidden flex items-center gap-1.5">
        <input id="ed-find-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar…"
          class="flex-1 min-w-0 bg-slate-900 text-slate-100 font-mono rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-emerald-600" />
        <button id="ed-find-prev">&#9650;</button>
        <button id="ed-find-next">&#9660;</button>
      </div>
    </div>
    <div id="editor-host" class="relative flex-1 min-h-0"></div>
    <div id="ed-msg" class="hidden flex-1 min-h-0 overflow-auto p-4 text-sm text-slate-400"></div>
  </section>

  <!-- Controles de scroll del historial (siempre disponibles en un proyecto) -->
  <div id="scrollCtrls" class="hidden fixed right-3 bottom-28 z-40 flex flex-col gap-2">
    <button id="scrollUpBtn" title="Subir" class="bg-slate-700/90 active:bg-emerald-600 rounded-full w-10 h-10 text-lg shadow-lg">&#9650;</button>
    <button id="scrollDownBtn" title="Bajar" class="bg-slate-700/90 active:bg-emerald-600 rounded-full w-10 h-10 text-lg shadow-lg">&#9660;</button>
    <button id="scrollBottomBtn" title="Ir al final" class="bg-emerald-600 active:bg-emerald-500 rounded-full w-10 h-10 text-lg shadow-lg">&#8595;</button>
  </div>

  <!-- Botones rápidos -->
  <footer id="quickbar" class="hidden bg-slate-800 px-2 py-1.5 shrink-0 flex flex-col gap-1.5">
    <!-- Teclas que el teclado del celular no tiene -->
    <div id="keybar" class="flex gap-1.5 overflow-x-auto">
      <button data-key="esc">Esc</button>
      <button data-key="stab" title="Cambiar modo (normal / aceptar ediciones / plan)">⇧Tab</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
      <button data-key="enter">⏎</button>
      <button data-key="tab">Tab</button>
      <button data-key="ctrlc">^C</button>
      <button id="keysBtn">⌨ Más</button>
    </div>
    <!-- Acciones -->
    <div id="actionbar" class="flex gap-1.5 overflow-x-auto">
      <button id="cmdBtn">/ Comandos</button>
      <button id="filesBtn">📁 Archivos</button>
      <button id="attachBtn">📎 Adjuntar</button>
      <button id="copyBtn">📋 Copiar</button>
      <button id="pasteBtn">📥 Pegar</button>
      <button id="linksBtn">🔗 Links</button>
      <button id="usageBtn">📊 Uso</button>
    </div>
    <input id="attach-input" type="file" multiple class="hidden" />
  </footer>

  <!-- Menú de comandos "/" (todos los del CLI + los del proyecto/usuario) -->
  <div id="cmd-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 flex flex-col gap-3 h-[80%]">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Comandos</h2>
        <button id="cmd-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <input id="cmd-search" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Buscar o escribir un comando…"
        class="w-full bg-slate-900 text-slate-100 text-sm font-mono rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-600" />
      <div id="cmd-list" class="flex-1 min-h-0 overflow-y-auto space-y-1"></div>
    </div>
  </div>

  <!-- Todas las teclas / atajos del CLI -->
  <div id="keys-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 flex flex-col gap-3 max-h-[80%]">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Teclas y atajos</h2>
        <button id="keys-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <div id="keys-list" class="grid grid-cols-2 gap-2 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Build detectado: ofrecer descargarlo al celular -->
  <div id="build-modal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-6">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h2 class="text-base font-semibold mb-1">📦 Build listo</h2>
      <p class="text-sm text-slate-300 mb-3">¿Querés descargarlo en el celular?</p>
      <div id="build-list" class="space-y-2 mb-4"></div>
      <div class="flex justify-end">
        <button id="build-no" class="px-4 py-2 rounded-lg bg-slate-700 active:bg-slate-600 text-sm">Ahora no</button>
      </div>
    </div>
  </div>

  <!-- Panel de uso detallado (botón "Uso") -->
  <div id="usage-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 space-y-4 max-h-[80%] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Uso de tu plan</h2>
        <button id="usage-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <div id="usage-windows" class="space-y-4">
        <p class="text-sm text-slate-400">Cargando…</p>
      </div>
      <p id="usage-updated" class="text-[11px] text-slate-500"></p>
    </div>
  </div>

  <!-- Panel con los links detectados en la pantalla -->
  <div id="links-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 flex flex-col gap-3 max-h-[80%]">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Links en pantalla</h2>
        <button id="links-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <div id="links-list" class="space-y-2 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Panel para pegar/enviar texto a la terminal -->
  <div id="paste-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 flex flex-col gap-3 max-h-[80%]">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Pegar texto</h2>
        <button id="paste-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <p class="text-[11px] text-slate-400">Revisá o editá el texto y tocá "Enviar" para mandarlo a Claude.</p>
      <textarea id="paste-text" class="flex-1 min-h-0 w-full bg-slate-900 text-slate-100 text-xs font-mono rounded-lg p-2 resize-none" style="min-height:8rem"></textarea>
      <button id="paste-send" class="w-full bg-emerald-600 active:bg-emerald-500 rounded-lg py-2 text-sm font-semibold">Enviar</button>
    </div>
  </div>

  <!-- Diálogo de confirmación propio (reemplaza el confirm() nativo) -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-6">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h2 id="confirm-title" class="text-base font-semibold mb-2">Confirmar</h2>
      <p id="confirm-msg" class="text-sm text-slate-300 mb-5"></p>
      <div class="flex gap-2 justify-end">
        <button id="confirm-cancel" class="px-4 py-2 rounded-lg bg-slate-700 active:bg-slate-600 text-sm">Cancelar</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-red-600 active:bg-red-500 text-sm font-semibold">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Estilo compartido de los botones de la barra rápida y del editor.
    document.querySelectorAll("#quickbar button, #ed-tools button, #ed-find button").forEach((b) =>
      b.classList.add("bg-slate-700", "active:bg-emerald-600", "text-slate-100",
        "text-sm", "font-mono", "px-3", "py-1.5", "rounded-lg", "whitespace-nowrap", "shrink-0"));
  </script>
  <script src="/app.js"></script>
</body>
</html>
