<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <title>Claude Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    html, body { height: 100%; overscroll-behavior: none; }
    #terminal { height: 100%; }
    /* Permite desplazar el historial con el dedo en el celular. */
    .xterm-viewport { touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen">
  <!-- Panel de control -->
  <header class="bg-slate-800 px-3 py-2 shadow-lg shrink-0">
    <div class="flex items-center justify-between text-xs mb-1">
      <div class="flex items-center gap-2 min-w-0">
        <button id="backBtn" title="Volver a proyectos" class="hidden bg-slate-700 active:bg-emerald-600 rounded-full w-7 h-7 flex items-center justify-center text-lg leading-none shrink-0">&#8592;</button>
        <span id="proj-name" class="font-semibold truncate">Uso de tokens</span>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="stopBtn" title="Cerrar la sesión (detiene el proceso)" class="hidden bg-red-600 active:bg-red-500 rounded px-2 py-0.5 text-[11px] font-semibold">Cerrar</button>
        <span id="reset-timer" class="font-mono text-amber-400">--:--:--</span>
      </div>
    </div>
    <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
      <div id="usage-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
    </div>
    <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400">
      <span id="usage-label">0%</span>
      <span id="conn-status" class="text-red-400">&#9679; desconectado</span>
    </div>
  </header>

  <!-- Selector de proyectos -->
  <section id="picker" class="flex-1 min-h-0 overflow-y-auto p-3">
    <h1 class="text-lg font-semibold mb-1">Elegí un proyecto</h1>
    <p id="picker-hint" class="text-xs text-slate-400 mb-3">Cargando…</p>
    <div id="proj-list" class="grid grid-cols-1 gap-2"></div>
  </section>

  <!-- Terminal -->
  <main id="terminal" class="flex-1 min-h-0 px-1 py-1 hidden"></main>

  <!-- Controles de scroll del historial (siempre disponibles en un proyecto) -->
  <div id="scrollCtrls" class="hidden fixed right-3 bottom-20 z-40 flex flex-col gap-2">
    <button id="scrollUpBtn" title="Subir" class="bg-slate-700/90 active:bg-emerald-600 rounded-full w-10 h-10 text-lg shadow-lg">&#9650;</button>
    <button id="scrollDownBtn" title="Bajar" class="bg-slate-700/90 active:bg-emerald-600 rounded-full w-10 h-10 text-lg shadow-lg">&#9660;</button>
    <button id="scrollBottomBtn" title="Ir al final" class="hidden bg-emerald-600 active:bg-emerald-500 rounded-full w-10 h-10 text-lg shadow-lg">&#8595;</button>
  </div>

  <!-- Botones rápidos -->
  <footer id="quickbar" class="hidden bg-slate-800 px-2 py-2 gap-2 shrink-0 overflow-x-auto flex">
    <button data-cmd="/compact">/compact</button>
    <button data-cmd="/clear">/clear</button>
    <button id="usageBtn">📊 Uso</button>
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="ctrlc">Ctrl+C</button>
  </footer>

  <!-- Panel de uso detallado (botón "Uso") -->
  <div id="usage-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end">
    <div class="bg-slate-800 w-full rounded-t-2xl p-4 space-y-4 max-h-[80%] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Uso de tu plan</h2>
        <button id="usage-close" class="text-slate-400 text-lg px-2 active:text-white">&#10005;</button>
      </div>
      <div id="usage-windows" class="space-y-4">
        <p class="text-sm text-slate-400">Cargando…</p>
      </div>
      <p id="usage-updated" class="text-[11px] text-slate-500"></p>
    </div>
  </div>

  <!-- Diálogo de confirmación propio (reemplaza el confirm() nativo) -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-6">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-xl">
      <h2 id="confirm-title" class="text-base font-semibold mb-2">Confirmar</h2>
      <p id="confirm-msg" class="text-sm text-slate-300 mb-5"></p>
      <div class="flex gap-2 justify-end">
        <button id="confirm-cancel" class="px-4 py-2 rounded-lg bg-slate-700 active:bg-slate-600 text-sm">Cancelar</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-lg bg-red-600 active:bg-red-500 text-sm font-semibold">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Estilo compartido de los botones de la barra rápida.
    document.querySelectorAll("#quickbar button").forEach((b) =>
      b.classList.add("bg-slate-700", "active:bg-emerald-600", "text-slate-100",
        "text-sm", "font-mono", "px-3", "py-2", "rounded-lg", "whitespace-nowrap"));
  </script>
  <script src="/app.js"></script>
</body>
</html>
