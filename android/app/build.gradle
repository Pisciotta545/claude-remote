plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.claude.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.claude.remote"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "2.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // La librería de Tailscale (~20 MB) va comprimida: el APK baja mucho más liviano.
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Tailscale integrado (tsnet): se genera con android/tailnet/build.ps1
    implementation files('libs/tailnet.aar')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
