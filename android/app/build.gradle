plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Firma de producción: android/keystore.properties (fuera de git) apunta al .jks.
// El APK de release no es depurable (sin adb run-as ni inspección del WebView).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.claude.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.claude.remote"
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName "2.8"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    // Nombre del APK: <NombreApp>-v<versión>.apk (p. ej. ClaudeRemote-v2.4.apk).
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "${rootProject.name}-v${variant.versionName}.apk" }
    }

    // La librería de Tailscale (~20 MB) va comprimida: el APK baja mucho más liviano.
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Tailscale integrado (tsnet): se genera con android/tailnet/build.ps1
    implementation files('libs/tailnet.aar')
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
